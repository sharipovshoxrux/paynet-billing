spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
app:
  fixed-amount: ${APP_FIXED_AMOUNT:0}
internal:
  api:
    header-name: X-Internal-Key
    key: ${INTERNAL_KEY}