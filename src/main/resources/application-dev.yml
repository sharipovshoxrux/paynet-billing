spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
app:
  fixed-amount: 42000
springdoc:
  swagger-ui:
    default-models-expand-depth: -1
    doc-expansion: none
  paths-to-exclude: /api/v1/applications/**
